# Checks that tools/usrds_data_facts.R keeps values out of its shareable
# report, on a made-up folder (tools/check-usrds_data_facts.R). tools/ is
# left out of the package build, so R CMD check never runs this.
# Runs only when tools/ or the package code it calls changes. If this check
# is ever made required before merging, remove the paths filter, since a
# required check that never starts blocks the merge.
on:
  pull_request:
    paths:
      - "tools/**"
      - "R/**"
      - ".github/workflows/tools-check.yaml"
  push:
    branches: [main, master]
    paths:
      - "tools/**"
      - "R/**"
      - ".github/workflows/tools-check.yaml"
  workflow_dispatch:

name: tools-check.yaml

permissions: read-all

jobs:
  tools-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload

      - name: Check the data-facts report
        run: Rscript tools/check-usrds_data_facts.R
