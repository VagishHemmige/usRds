# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Reports line coverage in the job summary (Actions tab -> run -> Summary).
# Report only: it does not upload to an outside service and never fails on a
# low number. Tests that need real USRDS files skip here.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: Rscript .github/scripts/coverage-summary.R
